name: "🐞 X bug"
description: Report a reproducible bug in Xenocord patches for X.
title: "bug(X): "
labels: ["bug", "x"]
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues first.
        Report one bug per issue. Keep the title prefix unchanged.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and steps to reproduce.
      placeholder: |
        Expected:
        Actual:
        Steps:
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: X app version
      description: Version of the patched X app.
    validations:
      required: true

  - type: input
    id: patches-version
    attributes:
      label: Xenocord patch version
      description: Version of the Xenocord patch bundle.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs, if available.
      render: shell

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Confirm
      options:
        - label: I searched open and closed issues; this is not a duplicate.
          required: true
        - label: I included all relevant details.
          required: true
